<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Gerenciador de Tarefas</h1>

      <h2>Nova tarefa</h2>
      <form id="create-form">
        <label>
          Descrição
          <input
            name="descricao"
            type="text"
            placeholder="Digite a descrição da tarefa"
            required
          />
        </label>
        <label>
          Início do intervalo
          <input name="inicio" type="number" step="1" placeholder="1" required />
        </label>
        <label>
          Fim do intervalo
          <input name="fim" type="number" step="1" placeholder="1000" required />
        </label>
        <button class="primary-button" type="submit">Cadastrar tarefa</button>
      </form>

      <h2>Tarefas cadastradas</h2>
      <button id="refresh-button" class="refresh-button" type="button">
        Atualizar lista
      </button>
      <p id="notice" role="status" aria-live="polite" hidden></p>
      <ul id="task-list"></ul>
    </main>
  </body>
</html>
